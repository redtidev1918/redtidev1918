name: language-stats

on:
  schedule:
    - cron: "17 2 * * *"   # 每天 UTC 02:17（北京 10:17）
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "generated/**"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate language stats SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/gen_langs.py

      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          git commit -m "Update language stats [auto]" && git push || echo "No changes."
