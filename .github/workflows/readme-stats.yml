name: readme-stats

on:
  schedule:
    - cron: "17 2 * * *"   # 每天 UTC 02:17（北京 10:17）
  workflow_dispatch:
    inputs:
      sync_notifications:
        description: 'Install/update notifications only for repositories opted in via profile-config.json'
        type: boolean
        default: false
  repository_dispatch:
    types: [update-readme]
  push:
    branches: [main]
    paths-ignore:
      - "generated/**"
      - "README.md"

permissions:
  contents: write

# 多个仓库同时推送时只跑最新一次，避免重复生成互相抢着提交
concurrency:
  group: readme-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository policy
        run: python3 -m unittest discover -s tests

      - name: Install tokei
        run: |
          mkdir -p .bin
          curl -sL https://github.com/XAMPPRocky/tokei/releases/download/v12.1.2/tokei-x86_64-unknown-linux-gnu.tar.gz | tar xz -C .bin
          chmod +x .bin/tokei
          echo "$GITHUB_WORKSPACE/.bin" >> "$GITHUB_PATH"

      - name: Generate profile stats SVG (stars / LOC / repos / forks)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/gen_stats.py

      - name: Refresh repo list in README
        id: repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/gen_repos.py
          if git diff --quiet -- README.md README.en.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Cross-repository writes require an explicit manual run and per-repo opt-in.
      - name: Wire new repos (notify workflow + token)
        if: github.event_name == 'workflow_dispatch' && inputs.sync_notifications
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: python3 .github/scripts/sync_repos.py

      # 只有 stats.svg 内容真的变了才刷新缓存参数，
      # 否则每天都会产生一个只有 ?v= 变化的无意义提交。
      - name: Bust README image cache (only when stats changed)
        run: |
          if git diff --quiet -- generated/stats.svg; then
            echo "stats.svg unchanged; skip cache bust"
          else
            # 两份 README 引用同一张 SVG：只刷中文那份会让英文页一直命中旧缓存
            sed -i "s|generated/stats.svg?v=[0-9]*|generated/stats.svg?v=$(date +%s)|" README.md README.en.md
          fi

      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # README.en.md 必须一起 add：漏掉它会让英文索引永远停在最后一次手工提交
          git add generated/ README.md README.en.md
          git diff --cached --quiet || git commit -m "Update profile stats [auto]"
          git push
